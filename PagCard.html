<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card - AniGame</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topo">
      <h1 class="logo">Ani<span>Game</span></h1>

      <div class="pesquisa-topo">
        <span></span>
        <input
          id="anime-input"
          type="text"
          placeholder="Qual anime / jogo você quer achar?"
        />
        <button onclick="searchAnime()">🔍</button>
      </div>

      <div class="acoes">
        <span></span>
        <a href="Login.html"><button>Login</button></a>
      </div>
    </header>

    <aside class="menu-lateral">
      <nav>
        <a class="ativo" href="index.html">Início</a>
        <a href="Animes.html">Animes</a>
        <a href="Games.html">Jogos</a>
        <a href="popular.html">Em Alta</a>
        <a href="favorite.html">Favoritos</a>
        <a href="genres.html">Genêros</a>
        <a href="settings.html">Configurações</a>
      </nav>
    </aside>
    <main class="conteudo">
      <section id="detalhes-midia">
        <h2 id="titulo-midia">Carregando...</h2>

        <img id="capa-midia" alt="cada da midia">

        <p id="tipo-midia"></p>
        <p id="data-midia"></p>
        <p id="generos-midia"></p>

        <h3>Sinopse / Descrição</h3>
        <p id="descricao-midia"></p>
      </section>
    </main>

    <script src="pagCard.js"></script>
  </body>
</html>
