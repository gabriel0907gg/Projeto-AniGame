<!doctype html>

<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Card - AniGame</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <header class="topo">
      <a class="logo" href="index.html">Ani<span>Game</span></a>
      <form class="pesquisa-topo" id="busca-global">
        <input
          aria-label="Pesquisar"
          id="anime-input"
          placeholder="Pesquisar animes ou jogos"
          type="search"
        /><select aria-label="Categoria" id="categoria-busca">
          <option value="anime">Animes</option>
          <option value="game">Jogos</option></select
        ><button type="submit">Buscar</button>
      </form>
      <div class="acoes"><a data-auth-link="" href="Login.html">Login</a></div>
    </header>
    <aside class="menu-lateral">
      <nav aria-label="Menu principal">
        <a href="index.html">Início</a><a href="Animes.html">Animes</a
        ><a href="Games.html">Jogos</a><a href="popular.html">Em alta</a
        ><a href="favorite.html">Favoritos</a><a href="genres.html">Gêneros</a
        ><a href="settings.html">Configurações</a>
      </nav>
    </aside>
    <main class="conteudo">
      <section id="detalhes-midia">
        <div class="midia-hero">
          <img alt="Capa da mídia" id="capa-midia" />
          <div class="midia-info">
            <h2 id="titulo-midia">Carregando...</h2>
            <p id="tipo-midia"></p>
            <p id="data-midia"></p>
            <p id="generos-midia"></p>
          </div>
        </div>

        <h3>Sinopse / Descrição</h3>
        <p id="descricao-midia"></p>
        <section id="interacoes">
          <button id="favoritar">Favoritar</button>
          <p id="estado-interacoes"></p>
          <h3>Avaliar</h3>
          <form id="form-avaliacao">
            <label
              >Nota (1 a 10)
              <input
                max="10"
                min="1"
                name="nota"
                required=""
                type="number" /></label
            ><textarea
              maxlength="3000"
              name="comentario"
              placeholder="Seu comentário"
            ></textarea
            ><button>Avaliar</button>
          </form>
          <h3>Avaliações</h3>
          <div id="lista-avaliacoes"></div>
        </section>
      </section>
    </main>
    <script src="auth.js"></script>
    <script src="pagCard.js"></script>
    <script src="interacoes.js"></script>
    <script src="layout.js"></script>
  </body>
</html>
