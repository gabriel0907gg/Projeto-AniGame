<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogos - AniGame</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topo">
      <h1 class="logo">Ani<span>Game</span></h1>

      <div class="pesquisa-topo">
        <span></span>
        <input
          id="game-input"
          type="text"
          placeholder="Qual jogo você quer achar?"
        />
        <button onclick="searchGames()">🔍</button>
      </div>

      <div class="acoes">
        <span></span>
        <a href="Login.html"><button>Login</button></a>
      </div>
    </header>

    <aside class="menu-lateral">
      <nav>
        <a class="ativo" href="index.html">Início</a>
        <a href="Animes.html">Animes</a>
        <a href="Games.html">Jogos</a>
        <a href="popular.html">Em Alta</a>
        <a href="favorite.html">Favoritos</a>
        <a href="genres.html">Genêros</a>
        <a href="settings.html">Configurações</a>
      </nav>
    </aside>

    <main class="conteudo">
      <div id="home">
        <section class="destaques">
          <div id="lista-games"></div>
          <div id="observador-jogos"></div>
        </section>
      </div>

      <section id="resultados-pesquisa-games" hidden>
        <h2>Resultados da pesquisa</h2>
        <div id="lista-resultados"></div>
      </section>
    </main>

    <script src="games.js"></script>
  </body>
</html>
