<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniGame - Seu mundo de animes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topo">
      <h1 class="logo">Ani<span>Game</span></h1>

      <div class="pesquisa-topo">
        <span></span>
        <input
          id="anime-input"
          type="text"
          placeholder="Qual anime / jogo você quer achar?"
        />
        <button onclick="searchAnime()">🔍</button>
      </div>

      <div class="acoes">
        <span></span>
        <a href="Login.html"><button>Login</button></a>
      </div>
    </header>

    <aside class="menu-lateral">
      <nav>
        <a class="ativo" href="index.html">Início</a>
        <a href="Animes.html">Animes</a>
        <a href="Games.html">Jogos</a>
        <a href="popular.html">Em Alta</a>
        <a href="favorite.html">Favoritos</a>
        <a href="genres.html">Genêros</a>
        <a href="settings.html">Configurações</a>
      </nav>
    </aside>

    <main class="conteudo">
      <div id="home">
        <section class="banner">
          <div class="texo-banner">
            <h2>Ani<span>Game</span></h2>
            <h3>Seus animes favoritos, em um so lugar!</h3>
            <p>
              Explore milhares de animes, acompanhe seus favoritos<br />
              e viva grandes histórias!
            </p>
          </div>
        </section>

        <section class="destaques">
          <h2>🔥 Animes em destaque 💻</h2>

          <div id="lista-animes" class="listinha"></div>
        </section>

        <section class="destaques">
          <h2>🔥 Jogos em destaque 🎮</h2>

          <div id="lista-games" class="listinha"></div>
        </section>
      </div>

      <section id="resultados-pesquisa" hidden>
        <h2>Resultados da pesquisa</h2>
        <div id="lista-resultados"></div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="games.js"></script>
  </body>
</html>
