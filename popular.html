<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Em alta - AniGame</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <header class="topo">
      <a class="logo" href="index.html">Ani<span>Game</span></a>
      <form class="pesquisa-topo" id="busca-global">
        <input
          aria-label="Pesquisar"
          id="anime-input"
          placeholder="Pesquisar animes ou jogos"
          type="search"
        /><select aria-label="Categoria" id="categoria-busca">
          <option value="anime">Animes</option>
          <option value="game">Jogos</option></select
        ><button type="submit">Buscar</button>
      </form>
      <div class="acoes"><a data-auth-link="" href="Login.html">Login</a></div>
    </header>
    <aside class="menu-lateral">
      <nav aria-label="Menu principal">
        <a href="index.html">Início</a><a href="Animes.html">Animes</a
        ><a href="Games.html">Jogos</a
        ><a aria-current="page" class="ativo" href="popular.html">Em alta</a
        ><a href="favorite.html">Favoritos</a><a href="genres.html">Gêneros</a
        ><a href="settings.html">Configurações</a>
      </nav>
    </aside>
    <main class="conteudo">
      <h1>Em alta</h1>
      <h2>Animes populares</h2>
      <div class="grade-midia" id="pop-animes"></div>
      <h2>Jogos populares</h2>
      <div class="grade-midia" id="pop-games"></div>
      <p id="erro-pop"></p>
    </main>
    <script src="auth.js"></script>
    <script src="midia.js"></script>
    <script src="popular.js"></script>
    <script src="layout.js"></script>
  </body>
</html>
