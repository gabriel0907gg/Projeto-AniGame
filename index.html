<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniGame - Seu mundo de animes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topo">
      <h1 class="logo">Ani<span>Game</span></h1>

      <div class="pesquisa-topo">
        <span></span>
        <input
          id="anime-input"
          type="text"
          placeholder="Busque por anime, genero, personagem..."
        />
      </div>

      <div class="acoes">
        <span></span>
        <button>Entrar</button>
      </div>
    </header>

    <aside class="menu-lateral">
      <nav>
        <a class="ativo" href="#">Início</a>
        <a href="#">Animes</a>
        <a href="#">Em Alta</a>
        <a href="#">Favoritos</a>
        <a href="#">Genêros</a>
        <a href="#">Configurações</a>
      </nav>
    </aside>

    <main class="conteudo">
      <section class="banner">
        <div class="texo-banner">
          <h2>Ani<span>Game</span></h2>
          <h3>Seus animes favoritos, em um so lugar!</h3>
          <p>
            Explore milhares de animes, acompanhe seus favoritos<br />
            e viva grandes histórias!
          </p>

          <div class="pesquisa-principal">
            <span></span>
            <input
              id="anime-input"
              type="text"
              placeholder="Qual anime voce quer assistir?"
            />
            <button onclick="searchAnime()">🔍</button>
          </div>
        </div>
      </section>

      <section class="destaques">
        <h2>🔥 Em destaque</h2>

        <div id="lista-animes"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
