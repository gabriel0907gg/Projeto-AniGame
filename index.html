<!doctype html>

<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AniGame - Seu mundo de animes</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <header class="topo">
      <a class="logo" href="index.html">Ani<span>Game</span></a>
      <form class="pesquisa-topo" id="busca-global">
        <input
          aria-label="Pesquisar"
          id="anime-input"
          placeholder="Pesquisar animes ou jogos"
          type="search"
        /><select aria-label="Categoria" id="categoria-busca">
          <option value="anime">Animes</option>
          <option value="game">Jogos</option></select
        ><button type="submit">Buscar</button>
      </form>
      <div class="acoes"><a data-auth-link="" href="Login.html">Login</a></div>
    </header>
    <aside class="menu-lateral">
      <nav aria-label="Menu principal">
        <a aria-current="page" class="ativo" href="index.html">Início</a
        ><a href="Animes.html">Animes</a><a href="Games.html">Jogos</a
        ><a href="popular.html">Em alta</a><a href="favorite.html">Favoritos</a
        ><a href="genres.html">Gêneros</a
        ><a href="settings.html">Configurações</a>
      </nav>
    </aside>
    <main class="conteudo">
      <div id="home">
        <section class="banner">
          <div class="texto-banner">
            <h2>Ani<span>Game</span></h2>
            <h3>Seus animes favoritos, em um so lugar!</h3>
            <p>
              Explore milhares de animes, acompanhe seus favoritos<br />
              e viva grandes histórias!
            </p>
          </div>
        </section>
        <section class="destaques">
          <h2>🔥 Animes em destaque 💻</h2>
          <div class="listinha" id="lista-animes"></div>
        </section>
        <section class="destaques">
          <h2>🔥 Jogos em destaque 🎮</h2>
          <div class="listinha" id="lista-games"></div>
        </section>
      </div>
      <section hidden="" id="resultados-pesquisa">
        <h2>Resultados da pesquisa</h2>
        <div id="lista-resultados"></div>
      </section>
    </main>
    <script src="script.js"></script>
    <script src="auth.js"></script>
    <script src="layout.js"></script>
  </body>
</html>
